<!doctype html>
<html lang="en">
  <body style="margin:0;padding:32px 16px;background:#f7f1ff;font-family:Arial,sans-serif;color:#302146">
    <table role="presentation" style="width:100%;max-width:560px;margin:auto;border-collapse:collapse;background:#fff;border-radius:20px;overflow:hidden">
      <tr><td style="padding:28px 36px;background:#7629bb;color:#fff;font-size:22px;font-weight:700">🎂 WishHappyBday</td></tr>
      <tr><td style="padding:36px">
        <h1 style="font-size:28px;line-height:1.2;margin:0 0 16px">Reset your password</h1>
        <p style="font-size:16px;line-height:1.6">We received a request to reset your WishHappyBday password. Use the button below to choose a new one.</p>
        <p style="margin:28px 0"><a href="<%= URL %>?code=<%= TOKEN %>" style="display:inline-block;padding:14px 24px;background:#7629bb;color:#fff;text-decoration:none;border-radius:30px;font-weight:700">Reset password</a></p>
        <p style="font-size:14px;line-height:1.6;color:#62546d">If you didn't request this, you can ignore this email. Your password will stay the same.</p>
        <p style="font-size:13px;line-height:1.6;color:#756b7e;margin-top:30px">WishHappyBday • A little magic for every birthday</p>
      </td></tr>
    </table>
  </body>
</html>

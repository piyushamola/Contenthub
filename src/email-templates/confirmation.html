<!doctype html>
<html lang="en">
  <body style="margin:0;padding:32px 16px;background:#f7f1ff;font-family:Arial,sans-serif;color:#302146">
    <table role="presentation" style="width:100%;max-width:560px;margin:auto;border-collapse:collapse;background:#fff;border-radius:20px;overflow:hidden">
      <tr><td style="padding:28px 36px;background:#7629bb;color:#fff;font-size:22px;font-weight:700">🎂 WishHappyBday</td></tr>
      <tr><td style="padding:36px">
        <p style="font-size:18px;margin:0 0 16px">Welcome to WishHappyBday!</p>
        <h1 style="font-size:28px;line-height:1.2;margin:0 0 16px">One click and you're in.</h1>
        <p style="font-size:16px;line-height:1.6">Confirm your email to start creating celebrations and keep them together in your dashboard.</p>
        <p style="margin:28px 0"><a href="<%= URL %>?confirmation=<%= CODE %>" style="display:inline-block;padding:14px 24px;background:#7629bb;color:#fff;text-decoration:none;border-radius:30px;font-weight:700">Confirm my email</a></p>
        <p style="font-size:14px;line-height:1.6;color:#62546d">Want a little inspiration? <a href="https://www.wishhappybdayto.me/gallery" style="color:#7629bb">Explore birthday demos</a>.</p>
        <p style="font-size:13px;line-height:1.6;color:#756b7e;margin-top:30px">If you didn't create an account, you can safely ignore this email.</p>
      </td></tr>
    </table>
  </body>
</html>
